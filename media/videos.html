<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الفيديوهات - وصل</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {--brand1:#00686D;--brand2:#68C3A3;--bg:#f7f9fb;}
body{margin:0;font-family:'Tajawal',sans-serif;background:var(--bg);display:flex;flex-direction:column;min-height:100vh;}
main{flex:1;padding:40px;max-width:900px;margin:auto;text-align:center;}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;}
.video-grid iframe{width:100%;height:180px;border-radius:10px;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.2);}
</style>
</head>
<body>
<div id="header"></div>

<main>
  <h1 style="color:var(--brand1);margin-bottom:25px;">🎥 مكتبة الفيديوهات</h1>
  <div class="video-grid">
    <iframe src="https://www.youtube.com/embed/ysz5S6PUM-U" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/J---aiyznGQ" allowfullscreen></iframe>
  </div>
</main>

<div id="footer"></div>

<script>
async function loadPart(id,file){
  try{
    const res=await fetch(file);
    if(!res.ok) throw new Error();
    document.getElementById(id).innerHTML=await res.text();
    fixLinks(id);
  }catch(e){console.error("خطأ في تحميل",file);}
}
loadPart('header','../header.html');
loadPart('footer','../footer.html');

function fixLinks(sectionId){
  const section=document.getElementById(sectionId);
  const anchors=section.querySelectorAll('a[href]');
  anchors.forEach(a=>{
    const href=a.getAttribute('href');
    if(!href.startsWith('http') && !href.startsWith('../') && !href.startsWith('#')){
      a.setAttribute('href','../'+href);
    }
  });
}
</script>
</body>
</html>
