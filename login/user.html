<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل دخول المستفيد - وصل</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {--brand1:#00686D;--brand2:#68C3A3;--gold:#FFD700;--bg:#f7f9fb;}
*{box-sizing:border-box;font-family:'Tajawal',sans-serif;}
body{margin:0;background:var(--bg);display:flex;flex-direction:column;min-height:100vh;}
main{flex:1;display:flex;align-items:center;justify-content:center;}
.login-container{background:#fff;padding:40px 35px;border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);width:95%;max-width:400px;text-align:center;}
.logo{width:80px;height:80px;border-radius:50%;border:3px solid var(--gold);
margin-bottom:10px;box-shadow:0 0 10px rgba(255,215,0,.4);object-fit:cover;}
h2{color:var(--brand1);margin-bottom:25px;}
.input-group{margin-bottom:18px;text-align:right;}
.input-group label{display:block;margin-bottom:5px;color:#444;font-weight:600;}
.input-group input{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:8px;
font-size:1rem;transition:border-color .3s;}
.input-group input:focus{border-color:var(--brand1);outline:none;}
.btn{width:100%;padding:10px 0;background:linear-gradient(90deg,var(--brand1),var(--brand2));
border:none;border-radius:8px;color:#fff;font-size:1.1rem;font-weight:600;cursor:pointer;
transition:opacity .3s;}
.btn:hover{opacity:0.9;}
.links{margin-top:15px;}
.links a{text-decoration:none;color:var(--brand1);font-weight:500;}
.links a:hover{color:var(--gold);}
.error-message{display:none;background:#fdd;border:1px solid #f99;padding:8px;border-radius:6px;
color:#b00;font-size:0.9rem;margin-bottom:10px;}
</style>
</head>
<body>

<div id="header"></div>

<main>
  <div class="login-container">

    <h2><i class="fa-solid fa-user"></i> تسجيل دخول المستفيد</h2>
    <div class="error-message" id="errorBox">يرجى إدخال البريد وكلمة المرور بشكل صحيح.</div>

    <form id="loginForm" onsubmit="return validateLogin(event)">
      <div class="input-group">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" required placeholder="example@email.com">
      </div>
      <div class="input-group">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button class="btn" type="submit">دخول</button>
    </form>

    <div class="links">
      <a href="#">نسيت كلمة المرور؟</a> |
      <a href="../../index.html">العودة للرئيسية</a>
    </div>
  </div>
</main>

<div id="footer"></div>

<script>
async function loadPart(id, file){
  try{
    const res = await fetch(file);
    if(!res.ok) throw new Error();
    document.getElementById(id).innerHTML = await res.text();
    fixLinks(id);
  }catch(e){console.error("خطأ في تحميل", file);}
}
loadPart('header','../../header.html');
loadPart('footer','../../footer.html');

function fixLinks(id){
  const section=document.getElementById(id);
  section.querySelectorAll('a[href]').forEach(a=>{
    const href=a.getAttribute('href');
    if(!href.startsWith('http')&&!href.startsWith('../')&&!href.startsWith('#')){
      a.setAttribute('href','../../'+href);
    }
  });
}

function validateLogin(e){
  e.preventDefault();
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('password').value.trim();
  const box=document.getElementById('errorBox');
  if(!email||!pass){box.style.display='block';return false;}
  box.style.display='none';
  alert(`مرحباً ${email}! تم تسجيل الدخول ✅`);
}
</script>
</body>
</html>
