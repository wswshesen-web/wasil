<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اتصل بنا - منصة وصل</title>
  <style>
    body {
      margin: 0;
      font-family: 'Tajawal', sans-serif;
      background-color: #f8fafc;
      direction: rtl;
    }
    main {
      padding: 40px 20px;
      text-align: center;
    }
    h1 {
      color: #00686D;
      font-size: 2.2rem;
      margin-bottom: 15px;
    }
    form {
      max-width: 600px;
      margin: 30px auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
      text-align: right;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      color: #00686D;
      font-weight: 600;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: 'Tajawal', sans-serif;
    }
    textarea {
      resize: vertical;
      height: 120px;
    }
    button {
      background: #00686D;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      margin-top: 15px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover {
      background: #68C3A3;
    }
  </style>
</head>
<body>
  <div id="header"></div>

  <main>
    <h1>اتصل بنا</h1>
    <p>نسعد بتواصلك معنا، يمكنك استخدام النموذج التالي لإرسال استفسارك أو اقتراحك.</p>

    <form onsubmit="handleSubmit(event)">
      <label for="name">الاسم الكامل</label>
      <input type="text" id="name" required>

      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" required>

      <label for="message">الرسالة</label>
      <textarea id="message" required></textarea>

      <button type="submit">إرسال</button>
    </form>
  </main>

  <div id="footer"></div>

  <script>
    async function loadPart(id, file) {
      const res = await fetch(file);
      const html = await res.text();
      document.getElementById(id).innerHTML = html;
    }
    loadPart('header', 'header.html');
    loadPart('footer', 'footer.html');

    function handleSubmit(e) {
      e.preventDefault();
      alert("تم إرسال رسالتك بنجاح ✅");
      e.target.reset();
    }
  </script>
</body>
</html>
