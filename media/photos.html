<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصور - وصل</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {--brand1:#00686D;--brand2:#68C3A3;--bg:#f7f9fb;}
body{margin:0;font-family:'Tajawal',sans-serif;background:var(--bg);display:flex;flex-direction:column;min-height:100vh;}
main{flex:1;padding:40px;max-width:1000px;margin:auto;text-align:center;}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px;}
.gallery img{width:100%;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,0.15);transition:transform .3s;}
.gallery img:hover{transform:scale(1.05);}
</style>
</head>
<body>
<div id="header"></div>

<main>
  <h1 style="color:var(--brand1);margin-bottom:20px;">📸 معرض الصور</h1>
  <div class="gallery">
    <img src="../images/photo1.jpg" alt="صورة 1" onerror="this.style.display='none'">
    <img src="../images/photo2.jpg" alt="صورة 2" onerror="this.style.display='none'">
    <img src="../images/photo3.jpg" alt="صورة 3" onerror="this.style.display='none'">
  </div>
</main>

<div id="footer"></div>

<script>
async function loadPart(id,file){
  try{
    const res=await fetch(file);
    if(!res.ok) throw new Error();
    document.getElementById(id).innerHTML=await res.text();
    fixLinks(id);
  }catch(e){console.error("خطأ في تحميل",file);}
}
loadPart('header','../header.html');
loadPart('footer','../footer.html');

function fixLinks(sectionId){
  const section=document.getElementById(sectionId);
  const anchors=section.querySelectorAll('a[href]');
  anchors.forEach(a=>{
    const href=a.getAttribute('href');
    if(!href.startsWith('http') && !href.startsWith('../') && !href.startsWith('#')){
      a.setAttribute('href','../'+href);
    }
  });
}
</script>
</body>
</html>
