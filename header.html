<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>رأس الصفحة - وصل</title>

  <!-- أيقونات -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    :root{
      --brand1:#00686D; --brand2:#68C3A3; --gold:#FFD700; --txt:#fff;
      --bg:linear-gradient(90deg,var(--brand1),var(--brand2));
    }
    *{box-sizing:border-box}
    html,body{margin:0;font-family:'Tajawal',sans-serif;direction:rtl;background:#f7f9fb}

    header{
      background:var(--bg); color:var(--txt);
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 40px; box-shadow:0 3px 8px rgba(0,0,0,.15); position:relative; z-index:100;
    }

    /* الشعار */
    .logo{display:flex;align-items:center;gap:12px}
    .logo img{
      width:60px;height:60px;border-radius:50%;
      border:3px solid var(--gold);object-fit:cover;
      background:radial-gradient(circle,#ffffff 20%,#f0f0f0 100%);
      box-shadow:0 0 10px rgba(255,215,0,.5)
    }
    .logo span{font-size:1.7rem;font-weight:700;color:var(--gold);text-shadow:0 0 5px rgba(0,0,0,.3)}

    /* القائمة الرئيسية */
    nav{display:flex;align-items:center;gap:16px}
    nav a,
    summary{
      color:#fff; text-decoration:none; font-weight:500;
      padding:8px 6px; border-radius:6px; cursor:pointer;
      transition:color .25s, background .25s, border-bottom .25s;
      list-style:none; outline:none;
    }
    nav a:hover, summary:hover{color:var(--gold)}
    nav a.active{color:var(--gold); border-bottom:2px solid var(--gold)}

    /* إخفاء السهم الافتراضي للـ summary */
    summary::-webkit-details-marker{display:none}
    summary::marker{content:""}

    /* مظهر عنصر منسدلة عام */
    details{position:relative}
    summary i{margin-inline-start:6px}
    summary::after{
      content:"▼"; font-size:.7em; margin-inline-start:6px
    }

    /* محتوى المنسدلة */
    .menu-panel{
      position:absolute; inset-inline-end:0; top:100%;
      min-width:200px; background:#fff; color:#111;
      border-radius:10px; box-shadow:0 8px 20px rgba(0,0,0,.15);
      padding:6px; display:none; z-index:1000;
    }
    details[open] .menu-panel{display:block}

    .menu-panel a{
      display:flex; align-items:center; gap:10px;
      padding:10px 12px; color:#111; text-decoration:none;
      border-radius:8px; transition:background .2s
    }
    .menu-panel a:hover{background:#f2fbf8}
    .menu-panel a i{color:var(--brand1)}

    /* تبديل قائمة الجوال بـ checkbox (بدون JS) */
    #navToggle{display:none}
    .menu-btn{
      display:none; font-size:1.8rem; cursor:pointer; user-select:none;
    }

    /* جوال */
    @media (max-width:768px){
      header{padding:12px 16px}
      .menu-btn{display:block}
      nav{
        display:none; flex-direction:column; text-align:center;
        position:absolute; top:70px; inset-inline:0;
        background:var(--brand1); padding:12px 0; z-index:200;
      }
      #navToggle:checked ~ nav{display:flex}

      /* المنسدلات داخل الجوال */
      details{width:100%}
      summary{display:block; padding:10px 0}
      .menu-panel{
        position:static; display:none; background:#fff; color:#111;
        box-shadow:none; border-radius:0; padding:0 10px 8px;
      }
      details[open] .menu-panel{display:block}
      .menu-panel a{justify-content:center}
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <!-- onerror: مسار احتياطي محلي لو تعذر التحميل النسبي -->
      <img src="../images/logo.png" alt="شعار وصل"
           onerror="this.src='file:///C:/Users/user/wasil/images/logo.png'">
      <span>وصل</span>
    </div>

    <!-- زر الجوال (بدون JS) -->
    <label for="navToggle" class="menu-btn" aria-label="فتح القائمة">☰</label>
    <input type="checkbox" id="navToggle" hidden>

    <nav aria-label="القائمة الرئيسية">
      <a href="index.html">الرئيسية</a>
      <a href="about.html">عن المنصة</a>
      <a href="services.html">الخدمات</a>
      <a href="forsaty.html">فرصتي</a>
      <a href="mazaya.html">مزايا</a>

      <!-- المركز الإعلامي (منسدل بدون JS) -->
      <details>
        <summary><i class="fa-solid fa-photo-film"></i>المركز الإعلامي</summary>
        <div class="menu-panel" role="menu">
          <a href="media/photos.html"><i class="fa-solid fa-camera"></i>الصور</a>
          <a href="media/videos.html"><i class="fa-solid fa-video"></i>الفيديوهات</a>
          <a href="media/news.html"><i class="fa-solid fa-newspaper"></i>الأخبار</a>
        </div>
      </details>

      <a href="contact.html">اتصل بنا</a>

      <!-- تسجيل الدخول (منسدل بدون JS) -->
      <details>
        <summary><i class="fa-solid fa-right-to-bracket"></i>تسجيل الدخول</summary>
        <div class="menu-panel" role="menu">
          <a href="login/user.html"><i class="fa-solid fa-user"></i>لوحة تحكم المستفيد</a>
          <a href="login/org.html"><i class="fa-solid fa-building"></i>لوحة تحكم الجهات الخارجية</a>
        </div>
      </details>
    </nav>
  </header>
</body>
</html>
