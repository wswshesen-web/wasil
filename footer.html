<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تذييل الصفحة - وصل</title>
  <style>
    footer {
      background: linear-gradient(180deg, #00686D, #00484C);
      color: #fff;
      text-align: center;
      padding: 25px 10px;
      font-family: 'Tajawal', sans-serif;
    }
    .footer-links a {
      color: #FFD700;
      text-decoration: none;
      margin: 0 10px;
      font-weight: 500;
    }
    .footer-links a:hover { text-decoration: underline; }
    .social {
      margin: 10px 0;
    }
    .social a {
      color: #fff;
      margin: 0 8px;
      font-size: 1.3rem;
      transition: color 0.3s;
    }
    .social a:hover { color: #FFD700; }
    .copy {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #ccc;
    }
  </style>
</head>
<body>
  <footer>
    <div class="footer-links">
      <a href="#">عن المنصة</a> |
      <a href="#">الشروط والأحكام</a> |
      <a href="#">سياسة الخصوصية</a>
    </div>
    <div class="social">
      <a href="#">🐦</a>
      <a href="#">📘</a>
      <a href="#">📸</a>
      <a href="#">▶️</a>
    </div>
    <div class="copy">
      © 2025 جمعية لأجلهم — منصة <strong>وصل</strong> | جميع الحقوق محفوظة
    </div>
  </footer>
</body>
</html>
